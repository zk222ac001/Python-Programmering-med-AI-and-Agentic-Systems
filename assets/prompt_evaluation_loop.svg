<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6D28D9"/>
    <stop offset="50%" stop-color="#2563EB"/>
    <stop offset="100%" stop-color="#06B6D4"/>
  </linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F97316"/>
    <stop offset="100%" stop-color="#F43F5E"/>
  </linearGradient>
  <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#10B981"/>
    <stop offset="100%" stop-color="#14B8A6"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.18"/>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#F8FAFC"/>

<text x="800" y="92" text-anchor="middle" font-family="Arial" font-size="60" font-weight="800" fill="#111827">
  Prompt Evaluation Loop
</text>
<text x="800" y="145" text-anchor="middle" font-family="Arial" font-size="28" fill="#475569">
  Treat prompts like software: version them, test them, measure them, improve them
</text>
<circle cx="800" cy="490" r="155" fill="url(#g1)" filter="url(#shadow)"/>
<text x="800" y="475" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#FFFFFF">PROMPT</text>
<text x="800" y="520" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#FFFFFF">ENGINEERING</text>

<circle cx="800" cy="235" r="82" fill="#7C3AED" filter="url(#shadow)"/>
<text x="800" y="245" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#FFFFFF">CREATE</text>

<circle cx="1110" cy="340" r="82" fill="#2563EB" filter="url(#shadow)"/>
<text x="1110" y="350" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#FFFFFF">TEST</text>

<circle cx="1110" cy="650" r="82" fill="#059669" filter="url(#shadow)"/>
<text x="1110" y="660" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#FFFFFF">MEASURE</text>

