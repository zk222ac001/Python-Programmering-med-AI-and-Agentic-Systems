<text x="800" y="765" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#FFFFFF">COMPARE</text>

<circle cx="490" cy="650" r="82" fill="#E11D48" filter="url(#shadow)"/>
<text x="490" y="660" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#FFFFFF">IMPROVE</text>

<circle cx="490" cy="340" r="82" fill="#0891B2" filter="url(#shadow)"/>
<text x="490" y="350" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#FFFFFF">VERSION</text>

