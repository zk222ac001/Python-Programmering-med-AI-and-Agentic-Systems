<text x="220" y="383" text-anchor="middle" font-family="Arial" font-size="32" font-weight="800" fill="#FFFFFF">1</text>
<text x="220" y="455" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#7C3AED">USER INPUT</text>
<text x="220" y="505" text-anchor="middle" font-family="Arial" font-size="22" fill="#475569">topic, level, ticket</text>

