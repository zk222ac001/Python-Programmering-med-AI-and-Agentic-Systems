<text x="515" y="455" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#2563EB">PYTHON VARIABLES</text>
<text x="515" y="505" text-anchor="middle" font-family="Arial" font-size="22" fill="#475569">strings and data</text>

<path d="M640 440 L685 440" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
