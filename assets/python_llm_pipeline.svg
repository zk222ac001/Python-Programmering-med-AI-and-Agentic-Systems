<text x="810" y="383" text-anchor="middle" font-family="Arial" font-size="32" font-weight="800" fill="#FFFFFF">3</text>
<text x="810" y="455" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#EA580C">PROMPT TEMPLATE</text>
<text x="810" y="505" text-anchor="middle" font-family="Arial" font-size="22" fill="#475569">f-string + instructions</text>

<path d="M935 440 L980 440" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
