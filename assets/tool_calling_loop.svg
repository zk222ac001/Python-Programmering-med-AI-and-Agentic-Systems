<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.16"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748B"/></marker>
</defs>
<rect width="100%" height="100%" fill="#F8FAFC"/>
<text x="800" y="90" text-anchor="middle" font-family="Arial" font-size="55" font-weight="800" fill="#111827">Function Calling Flow</text>
<text x="800" y="140" text-anchor="middle" font-family="Arial" font-size="27" fill="#475569">The model chooses a tool; Python executes it; the result goes back to the model</text><rect x="80" y="310" width="240" height="260" rx="32" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="5" filter="url(#shadow)"/>
<circle cx="200" cy="375" r="38" fill="#1D4ED8"/>
<text x="200" y="388" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#FFFFFF">1</text>
<text x="200" y="460" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#1D4ED8">USER</text>
<foreignObject x="100" y="485" width="200" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;font-size:20px;color:#475569;text-align:center;line-height:1.25">asks for a task</div></foreignObject><line x1="328" y1="440" x2="370" y2="440" stroke="#64748B" stroke-width="9" marker-end="url(#arrow)"/><rect x="380" y="310" width="240" height="260" rx="32" fill="#FFFFFF" stroke="#3B82F6" stroke-width="5" filter="url(#shadow)"/>
<circle cx="500" cy="375" r="38" fill="#3B82F6"/>
<text x="500" y="388" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#FFFFFF">2</text>
<text x="500" y="460" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#3B82F6">LLM</text>
<foreignObject x="400" y="485" width="200" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;font-size:20px;color:#475569;text-align:center;line-height:1.25">selects a tool</div></foreignObject><line x1="628" y1="440" x2="670" y2="440" stroke="#64748B" stroke-width="9" marker-end="url(#arrow)"/><rect x="680" y="310" width="240" height="260" rx="32" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="5" filter="url(#shadow)"/>
<circle cx="800" cy="375" r="38" fill="#8B5CF6"/>
<text x="800" y="388" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#FFFFFF">3</text>
<text x="800" y="460" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#8B5CF6">PYTHON</text>
<foreignObject x="700" y="485" width="200" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;font-size:20px;color:#475569;text-align:center;line-height:1.25">executes function</div></foreignObject><line x1="928" y1="440" x2="970" y2="440" stroke="#64748B" stroke-width="9" marker-end="url(#arrow)"/><rect x="980" y="310" width="240" height="260" rx="32" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="5" filter="url(#shadow)"/>
<circle cx="1100" cy="375" r="38" fill="#0EA5E9"/>
<text x="1100" y="388" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#FFFFFF">4</text>
<text x="1100" y="460" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#0EA5E9">TOOL RESULT</text>
<foreignObject x="1000" y="485" width="200" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;font-size:20px;color:#475569;text-align:center;line-height:1.25">returns data</div></foreignObject><line x1="1228" y1="440" x2="1270" y2="440" stroke="#64748B" stroke-width="9" marker-end="url(#arrow)"/><rect x="1280" y="310" width="240" height="260" rx="32" fill="#FFFFFF" stroke="#10B981" stroke-width="5" filter="url(#shadow)"/>
<circle cx="1400" cy="375" r="38" fill="#10B981"/>
<text x="1400" y="388" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#FFFFFF">5</text>
<text x="1400" y="460" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#10B981">LLM</text>
<foreignObject x="1300" y="485" width="200" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;font-size:20px;color:#475569;text-align:center;line-height:1.25">writes final answer</div></foreignObject>
</svg>